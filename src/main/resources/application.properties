# MySQL do Aiven. No Render, preencha DB_PASSWORD com a senha atual do painel do Aiven.
# Para usar outro banco Aiven, informe DB_URL (JDBC com sslMode=REQUIRED) e DB_USERNAME.
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-e840162-valdineymarcio21-704a.c.aivencloud.com:11223/espelhovital?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${PORT:8081}

xai.api.key=${AI_API_KEY:}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5500}
app.mail.from=${MAIL_FROM:noreply@espelhovital.local}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
xai.api.url=${AI_API_URL:https://api.groq.com/openai/v1}
xai.api.model=${AI_MODEL:llama-3.1-8b-instant}

# Para rodar no IntelliJ, salve DB_PASSWORD no arquivo .env.local na raiz do projeto.
# Escreva DB_PASSWORD=SUA_SENHA_DO_AIVEN no .env.local e execute a classe principal.
spring.config.import=optional:file:./.env.local[.properties]
